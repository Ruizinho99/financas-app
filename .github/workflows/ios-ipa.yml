name: IPA para iOS

# Em cada release, compila a app para iOS sem assinatura e junta o .ipa à release.
# O .ipa não se instala diretamente: instala-se com AltStore, SideStore ou Sideloadly,
# que o assinam com o Apple ID de cada pessoa (ver README).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release onde juntar o .ipa (ex.: v1.15.1)
        required: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar sem assinatura
        run: flutter build ios --release --no-codesign

      - name: Criar o .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "financas-${TAG}-ios-unsigned.ipa" Payload

      - name: Juntar à release
        run: gh release upload "$TAG" "financas-${TAG}-ios-unsigned.ipa" --clobber
